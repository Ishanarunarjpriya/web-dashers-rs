name: Windows build

on:
  push:
    branches: [main]
    paths: ["crates/**", "Cargo.toml", "Cargo.lock", ".github/workflows/windows.yml"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release -p wd-native
      - name: Headless picture of level 1 (checks the renderer)
        run: target\release\wd-native.exe --assets ref\assets --level 1 --shot shot.png --frames 200
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item target\release\wd-native.exe dist\WebDashers.exe
          Copy-Item ref\assets dist\assets -Recurse
          Copy-Item shot.png dist\shot.png
      - uses: actions/upload-artifact@v4
        with:
          name: WebDashers-windows
          path: dist

name: Windows build

on:
  push:
    branches: [main]
    paths: ["crates/**", "Cargo.toml", "Cargo.lock", ".github/workflows/windows.yml"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release -p wd-native
      - name: Headless pictures (main menu, level select, level 1)
        run: |
          target\release\wd-native.exe --assets ref\assets --shot menu.png --frames 90
          target\release\wd-native.exe --assets ref\assets --shot select.png --frames 200 --clicks 569,330 --every 100
          target\release\wd-native.exe --assets ref\assets --play 1 --shot play.png --frames 240 --hold 40
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item target\release\wd-native.exe dist\WebDashers.exe
          Copy-Item ref\assets dist\assets -Recurse
          Copy-Item menu.png,select.png,play.png dist\
      - uses: actions/upload-artifact@v4
        with:
          name: WebDashers-windows
          path: dist
